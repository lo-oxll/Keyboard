<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كيبورد الخط الكوفي</title>
<meta name="theme-color" content="#d1d3d9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi&family=Noto+Kufi+Arabic&family=Kufam&family=Reem+Kufi+Ink&family=Amiri&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main class="app">
  <div class="tools" role="toolbar" aria-label="أدوات النص">
    <button type="button" id="copy">نسخ</button>
    <button type="button" id="save">حفظ كصورة</button>
    <button type="button" id="clear">مسح</button>
    <div class="seg" role="group" aria-label="محاذاة النص">
      <button type="button" data-al="right" aria-label="محاذاة لليمين" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M10 12h10M6 18h14"/></svg></button>
      <button type="button" data-al="center" aria-label="توسيط" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M5 18h14"/></svg></button>
      <button type="button" data-al="left" aria-label="محاذاة لليسار" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h14"/></svg></button>
    </div>
  </div>
  <textarea id="ta" class="ta" dir="rtl" rows="1" inputmode="none" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="اكتب هنا..." aria-label="النص"></textarea>
  <section class="kbd" aria-label="الكيبورد">
    <div class="bar" id="fontBar" role="radiogroup" aria-label="الخط"></div>
    <div class="rows" id="rows" dir="ltr"></div>
    <div class="foot" dir="ltr">
      <button type="button" class="globe" id="globe" aria-label="تبديل الخط">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.2"/><ellipse cx="12" cy="12" rx="4" ry="9.2"/><path d="M2.8 12h18.4M4.2 7.2h15.6M4.2 16.8h15.6"/></svg>
      </button>
    </div>
  </section>
</main>
<dialog id="exp" class="exp" aria-labelledby="expT">
  <h2 id="expT">حفظ كصورة</h2>
  <canvas id="expPrev" class="prev" aria-label="معاينة الصورة"></canvas>
  <div class="grp" role="radiogroup" aria-label="الصيغة" id="fmtGrp"></div>
  <div class="grp" role="radiogroup" aria-label="الخلفية" id="bgGrp"></div>
  <p class="note" id="expNote" role="status"></p>
  <div class="acts"><button type="button" id="expGo" class="pri">تنزيل</button><button type="button" id="expX">إغلاق</button></div>
</dialog>
<script src="script.js?v=3"></script>
</body>
</html>
